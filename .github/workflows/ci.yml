  # Yii3（yiisoft/* 那一代）与上面的 Yii2 是两套东西：PSR-7/PSR-15/PSR-11 + yiisoft/config 配置组。
  # 骨架由 composer 真装（yiisoft/config 是 composer 插件，负责生成配置合并计划），
  # 断言走真 HttpApplicationRunner，另有 php -S + curl 的真 HTTP 冒烟。
  # 不需要 phpredis：这份 harness 用的是 predis（纯 PHP）。
  integration-yii3:
    name: PHP 8.2 - Yii3 端到端
    runs-on: ubuntu-latest
