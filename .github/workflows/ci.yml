name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} - phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.0, 8.1, 8.2, 8.3, 8.4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        # 本仓库不提交 composer.lock（见 .gitignore），CI 上没有 lock 可用，
        # 因此统一按当前 PHP 版本解析依赖：8.0 得到 phpunit 9.6，8.1+ 得到 10.5。
        run: composer update --no-interaction --prefer-dist

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

      - name: Lint every PHP file under this PHP version
        # 单测只加载 webman 适配器，其余六个框架的适配器代码不会被解析到。
        # 这一条保证「PHP ^8.0」的语法约束在全部源码上被真实执行，而不是靠静态扫描默认。
        run: find src commands config -name '*.php' -exec php -l {} + > /dev/null

  # 端到端：真装 webman 骨架 + 真起 HTTP 服务 + 真发请求跑完整上传链路。
  # 单测用的全是替身，证明不了「在 webman 里能跑」，这一条才是。
  # 只跑一个 PHP 版本（内核单测的版本矩阵已由上面的 job 覆盖）。
  integration-webman:
    name: PHP 8.2 - webman 端到端
    runs-on: ubuntu-latest

    services:
      # 第 8 条秒传需要 redis；缺了它会 markTestSkipped 而不是假装通过
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5


    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # runner 上下文在 **job 级** env 里不合法（GitHub 会直接判成 workflow file issue，
      # 整个 workflow 一个 job 都不启动），只能在 step 里经 $RUNNER_TEMP 写进 GITHUB_ENV。
      - name: Point TMPDIR at the runner temp dir
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          # 骨架就建在 runner 临时目录里，整目录可缓存 —— 这里显式钉死，
          # 免得以后改了 harness 的默认路径、缓存目录与实际目录悄悄错开
          echo "AETHERA_E2E_APP=$RUNNER_TEMP/aetherupload-webman-e2e" >> "$GITHUB_ENV"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php8.2-${{ hashFiles('composer.json') }}
          restore-keys: |
            composer-php8.2-

      - name: Cache webman skeleton
        # vendor/erikwang2013/aetherupload-webman 是指向本次 checkout 的软链，
        # 复用骨架不会用到旧代码；软链若失效，App::ensure() 会自动重装
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/aetherupload-webman-e2e
          key: e2e-webman-php8.2-${{ hashFiles('composer.json') }}
          restore-keys: |
            e2e-webman-php8.2-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          # 秒传走 webman/redis（illuminate/redis），需要 phpredis
          extensions: redis
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run webman end-to-end suite
        # 该套件在 bootstrap 里 composer create-project workerman/webman，把本仓库以 path 仓库装进骨架，
        # 再用 curl 打真实 HTTP；主套件的 phpunit.xml.dist 已 <exclude>tests/Integration</exclude>
        run: vendor/bin/phpunit -c tests/Integration/webman/phpunit.xml

      # ---- S3 存储驱动端到端（storage.driver=s3）：真 MinIO + 真上传链路 + mc 独立字节校验 ----
      # minio/minio 镜像已从 Docker Hub 下架（2026-10 本仓库 CI 实测 pull access denied），
      # 服务端改为从源码构建（Go 随 runner 预装；二进制走 actions/cache，首跑 2-3 分钟、命中后秒级）；
      # mc 用官方 GitHub Release 二进制（Hub 镜像可用性存疑；该资产 URL 已核验存在）。
      - name: Setup Go (MinIO build)
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Cache MinIO server binary
        uses: actions/cache@v4
        with:
          path: ~/go/bin/minio
          key: minio-server-${{ runner.os }}-v1  # 需要升级 MinIO 时轮换此 key

      - name: Build MinIO (cache miss) + start server + create bucket
        run: |
          if [ ! -x "$HOME/go/bin/minio" ]; then
            go install github.com/minio/minio@latest
          fi
          "$HOME/go/bin/minio" --version
          mkdir -p /tmp/minio-data
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup "$HOME/go/bin/minio" server --address 127.0.0.1:19000 /tmp/minio-data > /tmp/minio.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:19000/minio/health/live > /dev/null; then break; fi
            sleep 1
          done
          # 最后再探一次：30 次都没起来就让这一步失败，而不是带着死服务端去跑 S3 套件
          curl -sf http://127.0.0.1:19000/minio/health/live > /dev/null
          curl -fsSL -o /tmp/mc \
            https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x /tmp/mc
          # 放进 harness 的缓存目录：供其建桶（幂等）与 mc 独立字节校验复用
          mkdir -p "$RUNNER_TEMP/aetherupload-e2e-cache"
          cp /tmp/mc "$RUNNER_TEMP/aetherupload-e2e-cache/mc"
          MC_HOST_e2e="http://minioadmin:minioadmin@127.0.0.1:19000" /tmp/mc mb --ignore-existing e2e/aetherupload-e2e

      - name: Run S3 end-to-end suite
        # 端点/凭据/桶取 harness 默认值（http://127.0.0.1:19000 为上面步骤起的本机服务端）；
        # AETHERA_E2E_S3=1 由 phpunit-s3.xml 的 <env> 声明；服务端已探活，harness 不会再起自己的；
        # AETHERA_E2E_S3_CACHE 显式指向放入 mc 的缓存目录
        env:
          AETHERA_E2E_S3_CACHE: ${{ runner.temp }}/aetherupload-e2e-cache
        run: vendor/bin/phpunit -c tests/Integration/webman/phpunit-s3.xml --no-coverage

      - name: Dump MinIO log on failure
        if: failure()
        run: tail -300 /tmp/minio.log 2>/dev/null || true

      - name: Upload webman logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: webman-e2e-logs
          path: ${{ runner.temp }}/aetherupload-webman-e2e/runtime/logs
          if-no-files-found: ignore

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  # webman 之外的宿主：各自一条 job，装真框架（原生 PHP 那条不用装）、真跑完整上传链路。
  # 骨架搭建全部交给各自的 ci.sh（该脚本本地与 CI 共用同一条路），job 只负责环境与缓存。
  # 用 PHP 8.2：六个框架的当前版本都要求 >= 8.1；内核自身的 8.0 兼容性由上面的矩阵 job 覆盖。
  #
  # 注意：各 harness 会清自己的 aetherupload:* 键，因此**各自用专属 redis 库**
  # （webman 7 / laravel 4 / thinkphp 5 / slim 6 / symfony 8 / yii 9 / native 10 / yii3 11）；
  # 并行跑时共库会让第 8 条秒传偶发失败。
  integration-laravel:
    name: PHP 8.2 - Laravel 端到端
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # runner 上下文在 **job 级** env 里不合法（GitHub 会直接判成 workflow file issue，
      # 整个 workflow 一个 job 都不启动），只能在 step 里经 $RUNNER_TEMP 写进 GITHUB_ENV。
      - name: Point TMPDIR at the runner temp dir
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php8.2-${{ hashFiles('composer.json') }}
          restore-keys: composer-php8.2-
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: redis
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Run Laravel end-to-end suite
        run: bash tests/Integration/laravel/ci.sh
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

