name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} - phpunit
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.0, 8.1, 8.2, 8.3, 8.4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            composer-php${{ matrix.php }}-

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Install dependencies
        run: |
          if [ "${{ matrix.php }}" = "8.0" ]; then
            # composer.lock 锁定 phpunit 10.x（要求 PHP>=8.1），PHP 8.0 需重新解析出 phpunit 9.6
            composer update --no-interaction --prefer-dist phpunit/phpunit
          else
            composer install --no-interaction --prefer-dist
          fi

      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage
