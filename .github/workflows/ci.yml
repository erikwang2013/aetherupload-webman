    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php8.2-${{ hashFiles('composer.json') }}
          restore-keys: composer-php8.2-
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          extensions: redis
          tools: composer:v2
          coverage: none
      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist
      - name: Run Symfony end-to-end suite
        run: bash tests/Integration/symfony/ci.sh
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  integration-yii:
    name: PHP 8.2 - Yii 端到端
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-php8.2-${{ hashFiles('composer.json') }}
          restore-keys: composer-php8.2-
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
