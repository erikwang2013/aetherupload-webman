  # 原生 PHP（无框架）：宿主就是 PHP 自己，临时应用只有三个文件，起 php -S 用 curl 打真请求。
  # 这一条跑得最快（不用装任何框架），但它是「不装框架也能用」的唯一证据。
  integration-native:
    name: PHP 8.2 - 原生 PHP 端到端
    runs-on: ubuntu-latest
    services:
      # 第 8 条秒传需要 redis；原生适配器用 db 10，与其余 harness 错开
