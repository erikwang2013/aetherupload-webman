        run: bash tests/Integration/yii/ci.sh
      - name: Run test suite
        run: vendor/bin/phpunit --no-coverage

  integration-slim:
    name: PHP 8.2 - Slim 端到端
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
